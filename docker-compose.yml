services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiphone
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiphone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${MINIO_API_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "${MAILDEV_WEB_PORT:-51080}:1080"
      - "${MAILDEV_SMTP_PORT:-51025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1080 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-notification:
    image: node:24-alpine
    command:
      - node
      - -e
      - |
        const http = require("http");
        const deliveries = [];
        http.createServer((req, res) => {
          if (req.method === "GET" && req.url === "/health") {
            res.writeHead(200, {"content-type":"application/json"});
            res.end(JSON.stringify({ok:true, service:"mock-notification", deliveries:deliveries.length}));
            return;
          }
          if (req.method === "POST" && req.url === "/deliveries") {
            let body = "";
            req.on("data", chunk => body += chunk);
            req.on("end", () => {
              deliveries.push({receivedAt:new Date().toISOString(), body: body ? JSON.parse(body) : {}});
              res.writeHead(202, {"content-type":"application/json"});
              res.end(JSON.stringify({accepted:true, count:deliveries.length}));
            });
            return;
          }
          res.writeHead(404);
          res.end();
        }).listen(5088, "0.0.0.0");
    ports:
      - "${MOCK_NOTIFICATION_PORT:-55088}:5088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5088/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env.example
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aiphone
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
      MOCK_NOTIFICATION_URL: http://mock-notification:5088/deliveries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-notification:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: pnpm --filter @aiphone/api dev

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aiphone
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
      MOCK_NOTIFICATION_URL: http://mock-notification:5088/deliveries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-notification:
        condition: service_healthy
    ports:
      - "4001:4001"
    command: pnpm --filter @aiphone/worker dev

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    env_file: .env.example
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aiphone
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
    command: pnpm --filter @aiphone/admin exec next dev --hostname 0.0.0.0 --port 3000

volumes:
  postgres-data:
  minio-data:
